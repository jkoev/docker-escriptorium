[supervisord]
nodaemon=true

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /etc/postgresql/15/main/
user=postgres
priority=1
startsecs=5
autorestart=true

[program:redis]
command=redis-server --bind 127.0.0.1
autorestart=true
priority=5

[program:django-init]
command=/bin/bash "/django-init.sh"
directory=/home/escriptorium/escriptorium/app/
user=root
priority=10
autostart=true
autorestart=false
startsecs=0
startretries=1
stdout_logfile=/var/log/escriptorium.log
stderr_logfile=/var/log/escriptorium.err

[program:uwsgi]
command=uwsgi --module=escriptorium.wsgi:application --master --processes=5 --http=:8000 --vacuum --die-on-term --static-map /static=/home/escriptorium/escriptorium/app/static --static-map /media=/home/escriptorium/escriptorium/app/media
directory=/home/escriptorium/escriptorium/app
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/uwsgi.log
stderr_logfile=/var/log/uwsgi.err

[program:celery-default]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q default -c %(ENV_CELERY_MAIN_CONC)s --max-tasks-per-child=10
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-default.log
stderr_logfile=/var/log/celery-default.err

[program:celery-live]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q live -c %(ENV_CELERY_LIVE_CONC)s --max-tasks-per-child=10
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-live.log
stderr_logfile=/var/log/celery-live.err

[program:celery-low-priority]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q low-priority -c %(ENV_CELERY_LOW_CONC)s --max-tasks-per-child=10
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-low-priority.log
stderr_logfile=/var/log/celery-low-priority.err

# kraken training/segmentation/recognition work. Respects KRAKEN_TRAINING_DEVICE
# (cpu or cuda:0) from the container environment.
[program:celery-gpu]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q gpu -c 1 --max-tasks-per-child=1
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-gpu.log
stderr_logfile=/var/log/celery-gpu.err

# D-FINE layout/segmentation inference. Respects KRAKEN_INFERENCE_DEVICE.
[program:celery-intensive-inference]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q intensive-inference -c 1 --max-tasks-per-child=1
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-intensive-inference.log
stderr_logfile=/var/log/celery-intensive-inference.err

# text alignment (passim), only used when TEXT_ALIGNMENT=True is set.
[program:celery-jvm]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q jvm -c 2 --max-tasks-per-child=10
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
priority=20
autorestart=true
stdout_logfile=/var/log/celery-jvm.log
stderr_logfile=/var/log/celery-jvm.err

[program:flower]
command=celery --broker=redis://localhost:6379/0 flower --port=5555
directory=/home/escriptorium
user=escriptorium
autorestart=true
priority=1000


[program:channelserver]
command=daphne --bind 0.0.0.0 --port 5000 -v 1 escriptorium.asgi:application
directory=/home/escriptorium/escriptorium/app
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/daphne.log
stderr_logfile=/var/log/daphne.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

